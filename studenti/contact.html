<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <title>Contact - Sala de Jocuri FunZone</title>
</head>

<body>

    <h1>Contact Sala de Jocuri FunZone</h1>

    <p>Dacă ai întrebări sau vrei mai multe informații, completează formularul de mai jos sau folosește datele noastre de contact.</p>

    <h2>Date de contact</h2>
    <p><strong>Adresă:</strong> Str. Florilor nr. 10, Brașov</p>
    <p><strong>Telefon:</strong> 0712 345 678</p>
    <p><strong>Email:</strong> contact@funzone.ro</p>

    <h2>Trimite-ne un mesaj</h2>
    <form action="#" method="post">
        <label for="nume">Nume complet:</label><br>
        <input type="text" id="nume" name="nume" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="subiect">Subiect:</label><br>
        <input type="text" id="subiect" name="subiect" required><br><br>

        <label for="mesaj">Mesaj:</label><br>
        <textarea id="mesaj" name="mesaj" rows="5" cols="40" required></textarea><br><br>

        <input type="submit" value="Trimite mesajul">
    </form>

</body>

</html>
