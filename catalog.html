<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalog Studenți</title>
    <style>
         :root {
            --bg: #f6f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --line: #e5e7eb;
            --accent: #2563eb;
            --accent2: #1d4ed8;
            --danger: #dc2626;
            --ok: #16a34a;
            --shadow: 0 10px 25px rgba(0, 0, 0, .08);
            --radius: 16px;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        
        .wrap {
            max-width: 980px;
            margin: 40px auto;
            padding: 0 16px 60px;
        }
        
        h1 {
            margin: 0 0 16px;
            font-size: 34px;
            letter-spacing: -.3px;
        }
        
        .sub {
            margin: 0 0 24px;
            color: var(--muted);
            line-height: 1.5;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 18px;
            align-items: start;
        }
        
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px;
        }
        
        .card h2 {
            margin: 0 0 14px;
            font-size: 18px;
        }
        
        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 13px;
        }
        
        input,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            outline: none;
            background: #fff;
            transition: border-color .15s, box-shadow .15s;
            font-size: 14px;
        }
        
        input:focus,
        select:focus {
            border-color: rgba(37, 99, 235, .6);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, .12);
        }
        
        .btn {
            width: 100%;
            margin-top: 14px;
            padding: 11px 14px;
            border: 0;
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            font-weight: 800;
            cursor: pointer;
            transition: transform .05s ease, background .15s ease;
        }
        
        .btn:hover {
            background: var(--accent2);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .msg {
            margin-top: 12px;
            font-weight: 800;
            font-size: 13px;
            min-height: 18px;
        }
        
        .msg.ok {
            color: var(--ok);
        }
        
        .msg.err {
            color: var(--danger);
        }
        
        .table-wrap {
            overflow: auto;
            border-radius: var(--radius);
            border: 1px solid var(--line);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
            background: #fff;
        }
        
        thead th {
            position: sticky;
            top: 0;
            background: #f3f4f6;
            text-align: left;
            padding: 12px 12px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: #374151;
            border-bottom: 1px solid var(--line);
        }
        
        tbody td {
            padding: 12px 12px;
            border-bottom: 1px solid var(--line);
            font-size: 14px;
            color: #111827;
        }
        
        tbody tr:hover td {
            background: #f9fafb;
        }
        
        .pill {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(37, 99, 235, .10);
            color: var(--accent2);
            font-weight: 800;
            font-size: 12px;
        }
        
        .muted {
            color: var(--muted);
        }
        
        @media (max-width: 920px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>

<body>

    <div class="wrap">
        <h1>Catalog de Studenți</h1>
        <p class="sub">Adaugă un student și vezi lista actualizată instant (fără refresh).</p>

        <div class="grid">
            <form id="frm" class="card">
                <h2>Adaugă student</h2>

                <label>Nume</label>
                <input name="nume" required placeholder="Ex: Gaitan Ramina" />

                <label>An (1–4)</label>
                <select name="an" required>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>

                <label>Media (1–10)</label>
                <input name="media" type="number" step="0.01" min="1" max="10" required placeholder="Ex: 9.50" />

                <button class="btn" type="submit">Adaugă</button>
                <div class="msg" id="msg"></div>
            </form>

            <div class="card">
                <h2>Lista studenților <span class="muted">(ultimii adăugați apar sus)</span></h2>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Nume</th>
                                <th>An</th>
                                <th>Media</th>
                                <th>Creat la</th>
                            </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tbody = document.getElementById("tbody");
        const msg = document.getElementById("msg");
        const frm = document.getElementById("frm");

        function rowHtml(s) {
            return `<tr>
    <td>${escapeHtml(s.nume)}</td>
    <td>${s.an}</td>
    <td>${Number(s.media).toFixed(2)}</td>
    <td>${s.creat_la ?? ""}</td>
  </tr>`;
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, m => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[m]));
        }

        async function incarcaLista() {
            const r = await fetch("studenti.php");
            const data = await r.json();
            tbody.innerHTML = data.map(rowHtml).join("");
        }

        frm.addEventListener("submit", async(e) => {
            e.preventDefault();
            msg.textContent = "";

            const payload = {
                nume: frm.nume.value.trim(),
                an: Number(frm.an.value),
                media: Number(frm.media.value)
            };

            const r = await fetch("studenti.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            const data = await r.json();

            if (!r.ok || !data.success) {
                msg.className = "msg err";
                msg.textContent = data.error || "Eroare la salvare.";

                msg.style.color = "crimson";
                return;
            }

            // adăugăm instant sus în listă (fără refresh)
            tbody.insertAdjacentHTML("afterbegin", rowHtml(data.student));
            frm.reset();
            msg.className = "msg ok";
            msg.textContent = "Student adăugat!";

            msg.style.color = "green";
        });

        incarcaLista();
    </script>
</body>

</html>
